name: images

on:
  repository_dispatch:
    types: [flimkit-release]
  workflow_dispatch:
    inputs:
      flimkit_version:
        description: "FLIMKit version to build (blank = latest on PyPI)"
        required: false
        default: ""
      push_images:
        description: "Push to Docker Hub"
        required: false
        default: "true"
  schedule:
    # Weekly, so base image and dependency updates reach the images without a FLIMKit release
    - cron: '0 4 * * 1'
  pull_request:

# A newer run supersedes an older one, except for a release build, which is
# left alone so it cannot be cancelled part way through pushing tags.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'schedule' }}

env:
  IMAGE: alex1075/flimkit

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      push: ${{ steps.pick.outputs.push }}
    steps:
      - name: Pick the FLIMKit version
        id: pick
        run: |
          VERSION="${{ github.event.client_payload.version || inputs.flimkit_version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(curl -fsS https://pypi.org/pypi/flimkit/json | python3 -c "import json,sys; print(json.load(sys.stdin)['info']['version'])")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "push=${{ inputs.push_images }}" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi
          echo "FLIMKit $VERSION"

      - name: Check that version is on PyPI
        run: |
          VERSION="${{ steps.pick.outputs.version }}"
          for i in $(seq 1 60); do
            if curl -fsS "https://pypi.org/pypi/flimkit/$VERSION/json" >/dev/null 2>&1; then
              echo "flimkit $VERSION is on PyPI"
              exit 0
            fi
            echo "waiting for flimkit $VERSION to appear on PyPI..."
            sleep 20
          done
          echo "::error::flimkit $VERSION never appeared on PyPI"
          exit 1

  images:
    needs: version
    runs-on: ${{ matrix.runner || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: latest
            flavour: web
            extras: gui
            torch_index: ""
            desktop: 0
            python: "3.14"
            gpu: false
          - variant: desktop
            flavour: web
            extras: gui
            torch_index: ""
            desktop: 1
            python: "3.14"
            gpu: false
          - variant: cellpose
            flavour: web
            extras: gui,cellpose
            torch_index: https://download.pytorch.org/whl/cpu
            desktop: 0
            python: "3.14"
            gpu: false
          - variant: cuda
            flavour: web
            extras: gui,cellpose
            torch_index: https://download.pytorch.org/whl/cu126
            desktop: 0
            python: "3.14"
            gpu: true
          # ROCm wheels lag behind Python releases, so these stay on 3.12
          - variant: rocm
            flavour: web
            extras: gui,cellpose
            torch_index: https://download.pytorch.org/whl/rocm6.2
            desktop: 0
            python: "3.12"
            gpu: true
          # Headless: the bridge API for QuPath, Fiji and batch work, no X and no Tk
          - variant: cuda-headless
            flavour: bridge
            extras: cellpose
            torch_index: https://download.pytorch.org/whl/cu126
            desktop: 0
            python: "3.14"
            gpu: true
          - variant: rocm-headless
            flavour: bridge
            extras: cellpose
            torch_index: https://download.pytorch.org/whl/rocm6.2
            desktop: 0
            python: "3.12"
            gpu: true
          # The accelerator add-on (C kernels, and the CUDA library on the cuda one),
          # fetched from its private release with the ACCELERATOR_TOKEN secret.
          # arm64 builds natively on an Arm runner rather than under QEMU.
          - variant: accel-amd64
            flavour: web
            extras: gui
            torch_index: ""
            desktop: 0
            python: "3.14"
            gpu: false
            accel: 1
            accel_slug: linux-x86_64
            accel_cuda: 0
          - variant: accel-arm64
            flavour: web
            extras: gui
            torch_index: ""
            desktop: 0
            python: "3.14"
            gpu: false
            accel: 1
            accel_slug: linux-aarch64
            accel_cuda: 0
            runner: ubuntu-24.04-arm
            platform: linux/arm64
          - variant: cuda-accel-amd64
            flavour: web
            extras: gui,cellpose
            torch_index: https://download.pytorch.org/whl/cu126
            desktop: 0
            python: "3.14"
            gpu: true
            accel: 1
            accel_slug: linux-x86_64
            accel_cuda: 1
    steps:
      - uses: actions/checkout@v4

      - name: Check the accelerator token
        if: matrix.accel == 1
        env:
          ACCEL_TOKEN: ${{ secrets.ACCELERATOR_TOKEN }}
        run: |
          if [ -z "$ACCEL_TOKEN" ]; then
            echo "::error::ACCELERATOR_TOKEN is not set. It needs read access to contents of FLIMKit/FLIMKit-accelerator-plugin."
            exit 1
          fi

      - name: Free disk space
        if: matrix.gpu
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform || 'linux/amd64' }}
          load: true
          tags: flimkit-smoke:${{ matrix.variant }}
          build-args: |
            PYTHON_VERSION=${{ matrix.python }}
            FLIMKIT_VERSION=${{ needs.version.outputs.version }}
            FLIMKIT_EXTRAS=${{ matrix.extras }}
            TORCH_INDEX=${{ matrix.torch_index }}
            INCLUDE_DESKTOP=${{ matrix.desktop }}
            FLAVOUR=${{ matrix.flavour }}
            ACCELERATOR=${{ matrix.accel || 0 }}
            ACCEL_SLUG=${{ matrix.accel_slug || 'linux-x86_64' }}
            ACCEL_CUDA=${{ matrix.accel_cuda || 0 }}
          secrets: |
            accel_token=${{ secrets.ACCELERATOR_TOKEN }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      - name: Smoke test the web UI
        if: matrix.flavour == 'web'
        run: |
          docker run -d --name smoke -p 14500:14500 -e FLIMKIT_PASSWORD=smoke flimkit-smoke:${{ matrix.variant }}
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:14500/healthz >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:14500/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:14500/api/state)" = "401"
          curl -fsS -u flimkit:smoke http://127.0.0.1:14500/api/state \
            | python3 -c "import json, sys; s = json.load(sys.stdin); print('web UI up:', s['form'], len(s['fields']), 'fields')"
          docker exec smoke python -c "import flimkit; print('flimkit', flimkit.__file__)"

      - name: Smoke test the accelerator
        if: matrix.accel == 1
        run: |
          docker exec smoke python - <<'PY'
          import ctypes, os
          d = os.environ['FLIMKIT_PLUGIN_PATH'] + '/flimkit_accelerator_plugin/'
          lib = ctypes.CDLL(d + 'libflimkit_accelerator.so')
          print('C kernel abi', lib.flimkit_c_abi_version(), 'threads', lib.flimkit_c_threads())
          assert lib.flimkit_c_abi_version() == 3
          assert os.path.exists(d + 'libflimkit_accelerator_cuda.so') == bool(${{ matrix.accel_cuda }})
          PY

      - name: Smoke test the bridge
        if: matrix.flavour == 'bridge'
        run: |
          docker run -d --name smoke -p 8765:8765 -e FLIMKIT_BRIDGE_TOKEN=smoke flimkit-smoke:${{ matrix.variant }}
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:8765/v1/status >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8765/v1/status \
            | python3 -c "import json, sys; s = json.load(sys.stdin); print('bridge up: protocol', s.get('protocol_version'), 'flimkit', s.get('flimkit_version'))"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/v1/fit/defaults)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer smoke' http://127.0.0.1:8765/v1/fit/defaults)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: elsewhere' http://127.0.0.1:8765/v1/status)" = "403"
          docker exec smoke sh -c "python -c 'import tkinter' 2>&1 | tail -1"

      - name: Container logs
        if: always()
        run: docker logs smoke || true

      - name: Log in to Docker Hub
        if: needs.version.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push
        if: needs.version.outputs.push == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform || 'linux/amd64' }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ matrix.variant }}
            ${{ env.IMAGE }}:${{ needs.version.outputs.version }}-${{ matrix.variant }}
          build-args: |
            PYTHON_VERSION=${{ matrix.python }}
            FLIMKIT_VERSION=${{ needs.version.outputs.version }}
            FLIMKIT_EXTRAS=${{ matrix.extras }}
            TORCH_INDEX=${{ matrix.torch_index }}
            INCLUDE_DESKTOP=${{ matrix.desktop }}
            FLAVOUR=${{ matrix.flavour }}
            ACCELERATOR=${{ matrix.accel || 0 }}
            ACCEL_SLUG=${{ matrix.accel_slug || 'linux-x86_64' }}
            ACCEL_CUDA=${{ matrix.accel_cuda || 0 }}
          secrets: |
            accel_token=${{ secrets.ACCELERATOR_TOKEN }}
          cache-from: type=gha,scope=${{ matrix.variant }}
